server:
  port: 8093

spring:
  application:
    name: mcp-clothes-state
  ai:
    mcp:
      server:
        name: mcp-clothes-state
        version: 0.1.0
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: 옷 사진에서 옷 한 벌마다 종류·색·얼룩·찢어짐을 찾는 서버입니다(clothes_inspect). 옷 추천 2단계에서 사진마다 부릅니다. 같이 입을 옷들의 색 조합·자리에 맞는 색은 outfit_color_check로 봅니다.

# 기준값: 0.5 바로 알림 / 0.2~0.5 GPT 확인 (정지원 2026-11-09, docs/gpt-check.md)
clothes:
  model: ${CLOTHES_MODEL:classpath:models/yolo26n_v6.onnx}
  model-version: yolo26n-v6
  tell-threshold: 0.5
  ask-threshold: 0.2
  max-image-bytes: 8MB
  # 옷 종류(셔츠·티셔츠·니트·가디건·자켓·코트·조끼·바지·반바지·치마·원피스·신발). Fashionpedia(CC BY 4.0)로 학습. 파일이 없으면 사진 전체를 옷 한 벌로 봄.
  garment-model: ${CLOTHES_GARMENT_MODEL:classpath:models/yolo26n_fashion12.onnx}
  garment-model-version: yolo26n-fashion12
  # 학습 클래스 순서. 5종 모델이면 top,bottom,outer,dress,shoes
  garment-classes: shirt,tshirt,sweater,cardigan,jacket,coat,vest,pants,shorts,skirt,dress,shoes
  garment-threshold: 0.4
  laid-garment-threshold: 0.25
  # 애매한 결함 조각만 GPT에게 물음. 키는 환경 변수로만(비면 묻지 않고 pendingHelper로 돌려줌)
  gpt:
    api-key: ${OPENAI_API_KEY:}
    model: ${CLOTHES_GPT_MODEL:gpt-4.1-mini}
    # GPT가 결함이라고 한 조각만 저장(다시 학습할 후보). 비우면 저장 안 함
    candidate-dir: ${CLOTHES_CANDIDATE_DIR:data/train-candidates}

management:
  endpoints:
    web:
      exposure:
        include: health
