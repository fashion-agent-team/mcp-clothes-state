server:
  port: 8093

spring:
  application:
    name: mcp-clothes-state
  ai:
    mcp:
      server:
        name: mcp-clothes-state
        version: 0.1.0
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: 옷 사진에서 옷 한 벌마다 종류·색·얼룩·찢어짐을 찾는 서버입니다(clothes_inspect). 옷 추천 2단계에서 사진마다 부릅니다. 같이 입을 옷들의 색 조합·자리에 맞는 색은 outfit_color_check로 봅니다.

# 기준값: 0.5 바로 알림 / 0.2~0.5 GPT 확인 (정지원 2026-11-09, docs/gpt-check.md)
clothes:
  model: ${CLOTHES_MODEL:classpath:models/yolo26n_v6.onnx}
  model-version: yolo26n-v6
  tell-threshold: 0.5
  ask-threshold: 0.2
  max-image-bytes: 8MB
  # 옷 종류(셔츠·티셔츠·니트·가디건·자켓·코트·조끼·바지·반바지·치마·원피스·신발). Fashionpedia(CC BY 4.0)로 학습. 파일이 없으면 사진 전체를 옷 한 벌로 봄.
  garment-model: ${CLOTHES_GARMENT_MODEL:classpath:models/yolo26n_fashion12.onnx}
  garment-model-version: yolo26n-fashion12e
  # 학습 클래스 순서. 5종 모델이면 top,bottom,outer,dress,shoes
  garment-classes: shirt,tshirt,sweater,cardigan,jacket,coat,vest,pants,shorts,skirt,dress,shoes
  # 옷 색 인식(흰색·검정·하늘색 등 K-Fashion 20색). AI Hub K-Fashion 옷 17만 벌로 학습(training/color-model). 파일이 없으면 픽셀 규칙
  color-model: ${CLOTHES_COLOR_MODEL:classpath:models/color20_cnn.onnx}
  garment-threshold: 0.4
  laid-garment-threshold: 0.25
  # 무늬 8종(plain·stripe·check·floral·dot·graphic·animal·other). Fashionpedia·Second-Hand Fashion(CC BY 4.0)로 학습.
  # 1등이 무늬인데 확률이 sure-threshold보다 낮으면 pattern=null(모름). 파일이 없으면 pattern 없이 응답
  pattern:
    model: ${CLOTHES_PATTERN_MODEL:classpath:models/yolo26n_pattern8.onnx}
    version: yolo26n-pattern8
    classes: animal,check,dot,floral,graphic,other,plain,stripe
    sure-threshold: 0.7
  # 옷마다 이미지 벡터(옷장에서 같은 옷 판단용, 이슈 #15). Marqo FashionSigLIP vision ONNX(Apache-2.0, 372MB)는 레포에 넣지 않고
  # 경로로 받음. 비어 있거나 파일이 없으면 embedding 없이 응답
  embed:
    model: ${CLOTHES_EMBED_MODEL:}
    version: marqo-fashionSigLIP
  # 옷 벡터를 옷 이름 글 벡터(미리 계산, 레포에 있음)와 견줘 종류를 다시 보고 빈 벽·바닥을 뺌. 옷 벡터 모델이 있을 때만 동작.
  # 근거: docs/training-log.md "글 벡터로 종류 다시 보기"(2026-11-12)
  text-check:
    vectors: ${CLOTHES_TEXT_VECTORS:classpath:models/garment-text-fsiglip.json}
    none-margin: 0.03
    keep-laid: 0.7
    keep-worn: 0.9
  # 애매한 결함 조각만 GPT에게 물음. 키는 환경 변수로만(비면 묻지 않고 pendingHelper로 돌려줌)
  gpt:
    api-key: ${OPENAI_API_KEY:}
    model: ${CLOTHES_GPT_MODEL:gpt-4.1-mini}
    # 애매한 얼룩 하나를 GPT에게 기다리는 시간. 넘기면 모델 결과로 답함(2026-11-13 3초 → 1.5초, 사진 답이 느려서)
    defect-timeout: ${CLOTHES_GPT_DEFECT_TIMEOUT:1500ms}
    # GPT가 결함이라고 한 조각만 저장(다시 학습할 후보). 비우면 저장 안 함
    candidate-dir: ${CLOTHES_CANDIDATE_DIR:data/train-candidates}

management:
  endpoints:
    web:
      exposure:
        include: health
